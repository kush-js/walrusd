name: walrusd CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CGO_ENABLED: "1"
      GOPROXY: https://proxy.golang.org,direct
      WALRUSD_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Prefetch Go modules (retry on proxy errors)
        run: |
          for attempt in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          echo "go mod download failed after 5 attempts"
          exit 1
      - name: Build
        run: go build -tags vfs ./...
      - name: Vet
        run: go vet -tags vfs ./...
      - name: Test
        run: go test -tags vfs -count=1 ./...
      - name: Test with race detector
        run: go test -tags vfs -race -count=1 ./...

  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Prefetch Go modules (retry on proxy errors)
        run: |
          for attempt in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          echo "go mod download failed after 5 attempts"
          exit 1
      - name: Build Go shared library
        run: |
          mkdir -p bindings/node/lib
          go build -buildmode=c-shared -tags vfs \
            -o bindings/node/lib/libwalrusd.so ./bindings/c/lib
      - name: Install Node dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build Node-API addon
        working-directory: bindings/node
        run: npx node-gyp rebuild -C native
      - name: Build TypeScript
        working-directory: bindings/node
        run: npx tsc -p .
      - name: Test Node bindings
        working-directory: bindings/node
        run: node --test smoke.test.mjs e2e.test.mjs

  bun:
    name: Bun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Prefetch Go modules (retry on proxy errors)
        run: |
          for attempt in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          echo "go mod download failed after 5 attempts"
          exit 1
      - name: Prefetch VFS Go modules (retry on proxy errors)
        working-directory: bindings/vfs
        run: |
          for attempt in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          echo "go mod download failed after 5 attempts"
          exit 1
      - name: Build Go shared library
        run: |
          mkdir -p bindings/node/lib
          go build -buildmode=c-shared -tags vfs \
            -o bindings/node/lib/libwalrusd.so ./bindings/c/lib
      - name: Build VFS loadable extension
        working-directory: bindings/vfs
        run: |
          go build -buildmode=c-shared \
            -tags "vfs SQLITE3VFS_LOADABLE_EXT" \
            -o libwalrusd_vfs.so .
      - name: Install Node dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build Node-API addon
        working-directory: bindings/node
        run: npx node-gyp rebuild -C native
      - name: Build TypeScript
        working-directory: bindings/node
        run: npx tsc -p .
      - name: Run Bun conformance suite
        run: bun test bindings/bun/walrusd.test.ts
        env:
          WALRUSD_TEST_FILE_ROOT: ${{ runner.temp }}/walrusd-bun-test

  release-build:
    name: Release build (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - go
      - node
      - bun
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Prefetch Go modules (retry on proxy errors)
        run: |
          for attempt in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          echo "go mod download failed after 5 attempts"
          exit 1
      - name: Build Go shared library
        run: |
          mkdir -p bindings/node/lib
          go build -buildmode=c-shared -tags vfs \
            -o bindings/node/lib/libwalrusd.so ./bindings/c/lib
      - name: Install Node dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build Node-API addon
        working-directory: bindings/node
        run: npx node-gyp rebuild -C native
      - name: Package release artifacts
        shell: bash
        run: |
          mkdir -p "release/${{ matrix.platform }}"
          cp bindings/node/native/build/Release/walrusd.node \
            "release/${{ matrix.platform }}/walrusd.node"
          cp bindings/node/lib/libwalrusd.so \
            "release/${{ matrix.platform }}/libwalrusd.so"
          tar -C release -czf "release/${{ matrix.platform }}.tar.gz" \
            "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: walrusd-${{ matrix.platform }}
          path: release/${{ matrix.platform }}.tar.gz
          if-no-files-found: error
      - name: Package npm prebuild
        shell: bash
        run: |
          mkdir -p "prebuilds/${{ matrix.platform }}"
          cp bindings/node/native/build/Release/walrusd.node \
            "prebuilds/${{ matrix.platform }}/walrusd.node"
          cp bindings/node/lib/libwalrusd.so \
            "prebuilds/${{ matrix.platform }}/libwalrusd.so"
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.platform }}
          path: prebuilds/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Write checksums
        working-directory: release-artifacts
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS

  publish:
    name: Publish npm package
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-build
    runs-on: ubuntu-latest
    permissions:
      # Enables npm OIDC trusted publishing if NPM_TOKEN is later removed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          path: bindings/node/prebuilds
          merge-multiple: true
      - name: Install Node dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build TypeScript
        working-directory: bindings/node
        run: npx tsc -p .
      - name: Check whether package version is already published
        id: published
        working-directory: bindings/node
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${package_name}@${package_version} is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.published.outputs.published != 'true'
        working-directory: bindings/node
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
